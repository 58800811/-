<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>高考英语真题题库</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1a2e;--mu:#6b7280;--pr:#2563eb;--prL:#dbeafe;--ok:#059669;--okL:#d1fae5;--er:#dc2626;--erL:#fee2e2;--wn:#d97706;--wnL:#fef3c7;--bd:#e5e7eb}

body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);line-height:1.65}
.app{max-width:820px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd);margin-bottom:16px;flex-wrap:wrap}
.top h1{font-size:1.05rem}
.top .st{font-size:.76rem;color:var(--mu)}
.tabs{display:flex;gap:4px;background:#e8eaef;border-radius:10px;padding:4px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{flex:1;min-width:64px;padding:9px 4px;border:0;background:transparent;border-radius:8px;font-size:.8rem;font-weight:600;color:var(--mu);cursor:pointer;font-family:inherit}
.tabs button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.bdg{font-size:.7rem;padding:3px 8px;border-radius:6px;font-weight:600;background:#f3f4f6;color:var(--mu)}
.bdg.t{background:var(--prL);color:var(--pr)}
.bdg.ok{background:var(--okL);color:var(--ok)}
.bdg.er{background:var(--erL);color:var(--er)}
.bdg.wn{background:var(--wnL);color:var(--wn)}
.pass{font-size:.88rem;line-height:1.8;color:#374151;margin-bottom:14px;max-height:34vh;overflow-y:auto;background:#f8fafc;padding:12px;border-radius:9px;position:relative}
.pass p{margin-bottom:9px}
.blank{display:inline-block;min-width:42px;border-bottom:2px solid var(--pr);text-align:center;color:var(--pr);font-weight:700;margin:0 2px;background:#fff}
.blank.hl{border-color:var(--er);color:var(--er);background:#fff5f5}
.qcard{border:2px solid var(--prL);border-radius:12px;padding:14px;background:#fafcff}
.stem{font-weight:700;font-size:.95rem;margin-bottom:10px;color:var(--pr)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;padding:12px 14px;border:1.5px solid var(--bd);border-radius:10px;cursor:pointer;font-size:.9rem;background:#fff;transition:.15s}
.opt:hover{border-color:#93c5fd;background:#f0f7ff}
.opt .l{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem}
.opt.ok{border-color:var(--ok);background:var(--okL)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--er);background:var(--erL)}
.opt.bad .l{background:var(--er);color:#fff}
.opt.sel{border-color:var(--pr);background:var(--prL)}
.opt.dis{pointer-events:none}
.inp{width:160px;padding:9px 12px;border:1.5px solid var(--bd);border-radius:9px;font-size:.95rem;font-family:inherit}
.inp:focus{outline:0;border-color:var(--pr)}
.inp.ok{border-color:var(--ok);background:var(--okL)}
.inp.bad{border-color:var(--er);background:var(--erL)}
.exp{margin-top:14px;padding:14px;background:#fff;border-left:4px solid var(--ok);border-radius:9px;font-size:.85rem;line-height:1.75;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.exp.wrong{border-left-color:var(--er)}
.exp .row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700;flex-wrap:wrap}
.exp .ans{display:inline-block;background:var(--okL);color:var(--ok);padding:3px 10px;border-radius:6px;font-weight:700}
.exp.wrong .ans{background:var(--erL);color:var(--er)}
.exp .lbl{color:var(--mu);font-weight:600;font-size:.8rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border:0;border-radius:9px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;background:var(--pr);color:#fff}
.btn:hover{background:#1d4ed8}
.btn.ok{background:var(--ok)}
.btn.ok:hover{background:#047857}
.btn.wn{background:var(--wn)}
.btn.o{background:transparent;border:1.5px solid var(--bd);color:var(--tx)}
.btn.o:hover{border-color:var(--pr);color:var(--pr)}
.btn.sm{padding:6px 14px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.prog-line{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog-line>div{height:100%;background:var(--pr);border-radius:99px;transition:.3s}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--bd);border-radius:9px;margin-bottom:7px;cursor:pointer;background:#fafafa;font-size:.85rem}
.item:hover{border-color:#93c5fd;background:#f0f7ff}
.tag{font-size:.68rem;padding:2px 7px;border-radius:5px;font-weight:600;white-space:nowrap}
.tag.n{background:var(--prL);color:var(--pr)}
.tag.r{background:var(--wnL);color:var(--wn)}
.tag.w{background:var(--erL);color:var(--er)}
.tag.m{background:var(--okL);color:var(--ok)}
.empty{text-align:center;padding:34px 16px;color:var(--mu);font-size:.88rem}
.hide{display:none!important}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;padding:9px 20px;border-radius:99px;font-size:.82rem;opacity:0;transition:.3s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.sb{background:#f8fafc;border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center}
.sb .n{font-size:1.55rem;font-weight:700;color:var(--pr)}
.sb .l{font-size:.74rem;color:var(--mu);margin-top:2px}
.prog{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:6px 0}
.prog>div{height:100%;background:var(--pr);border-radius:99px;transition:.3s}
.prog.ok>div{background:var(--ok)}
.prog.er>div{background:var(--er)}
.curve{display:flex;gap:4px;margin:10px 0}
.curve .pt{flex:1;text-align:center;font-size:.66rem;padding:6px 2px;border-radius:6px;background:#f3f4f6;color:var(--mu)}
.curve .pt.d{background:var(--okL);color:var(--ok)}
.curve .pt.c{background:var(--prL);color:var(--pr);font-weight:700}

.week .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.week .bar{width:100%;background:var(--pr);border-radius:4px 4px 0 0;min-height:2px;transition:.3s}
.week .col.ok .bar{background:var(--ok)}
.week .lbl{font-size:.62rem;color:var(--mu)}
.done-banner{text-align:center;padding:20px}
.done-banner .big{font-size:2rem;margin-bottom:6px}
/* ====== 复盘 & 选中翻译 ====== */
.sel-pop{position:fixed;z-index:200;background:#1a1a2e;color:#fff;border-radius:10px;padding:10px 14px;font-size:.82rem;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:300px;display:none}
.sel-pop .word{font-weight:700;font-size:.95rem;margin-bottom:4px;color:#93c5fd}
.sel-pop .trans{color:#e5e7eb;line-height:1.5;margin-bottom:8px}
.sel-pop .actions{display:flex;gap:6px;flex-wrap:wrap}
.sel-pop .actions button{border:0;border-radius:6px;padding:4px 10px;font-size:.76rem;font-weight:600;cursor:pointer;font-family:inherit}
.sel-pop .actions .add{background:var(--ok);color:#fff}
.sel-pop .actions .close{background:#374151;color:#d1d5db}
.sel-pop .in3500{display:inline-block;background:var(--okL);color:var(--ok);padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:700;margin-bottom:6px}
.sel-pop .not3500{display:inline-block;background:#374151;color:#9ca3af;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:700;margin-bottom:6px}
.wordbook-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--bd);border-radius:9px;margin-bottom:8px;background:#fafafa}
.wordbook-item .wd{font-weight:700;font-size:.95rem;color:var(--pr)}
.wordbook-item .tr{font-size:.82rem;color:var(--mu);margin-top:2px}
.wordbook-item .src{font-size:.72rem;color:#9ca3af;margin-top:2px}
.wordbook-item .del{background:transparent;border:1px solid var(--erL);color:var(--er);border-radius:6px;padding:4px 10px;font-size:.75rem;cursor:pointer;font-family:inherit}

@media(max-width:480px){.app{padding:8px}.pass{font-size:.83rem;max-height:28vh}.opt{font-size:.82rem;padding:10px 12px}.tabs button{font-size:.7rem;min-width:54px}.sg{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

// ============================================================
// 翻译（LibreTranslate + 本地词表兜底）
// ============================================================
const translateCache={};
async function translateText(text){
  const key=text.toLowerCase().trim();
  if(translateCache[key])return translateCache[key];
  // 先查本地3500词表
  const local=VOCAB3500[key];
  if(local){translateCache[key]=local;return local}
  // 联网翻译
  try{
    const r=await fetch("https://libretranslate.com/translate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q:text,source:"en",target:"zh",format:"text"})
    });
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    const result=d.translatedText||"";
    translateCache[key]=result;
    return result;
  }catch(e){
    const fallback="（联网翻译失败，请稍后重试）";
    translateCache[key]=fallback;
    return fallback;
  }
}

// 检查单词是否在3500词中

  const w=word.toLowerCase().trim();
  return VOCAB3500[w]||null;
}

  const pop=$("#selPop");
  popWord=word;
  $("#popWord").textContent=word;
  const v=in3500(word);
  $("#popBadge").innerHTML=v
    ?'<span class="in3500">✓ 高考3500词</span>'

  const pw=pop.offsetWidth||280;

  if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;

}

// 监听页面上的文本选择
document.addEventListener("mouseup",async e=>{
  if($("#selPop").contains(e.target))return;
  const sel=window.getSelection();
  const text=sel.toString().trim();
  if(!text||text.length>60||!/^[a-zA-Z\s'-]+$/.test(text)){hidePop();return}
  const word=text.replace(/\s+/g," ").trim();
  const rect=sel.getRangeAt(0).getBoundingClientRect();
  showPop(rect.left+rect.width/2,rect.top,word,"翻译中…");
  const trans=await translateText(word);
  if(popWord===word)$("#popTrans").textContent=trans;
});

  if(!$("#selPop").contains(e.target))hidePop();
});

// ============================================================
function analyze(){
  let tot=0,ok=0;const byType={},byDay={};
  for(const qid in S.ans){
    const q=QS.find(x=>x.id===qid);if(!q)continue;
    const t=q.type;if(!byType[t])byType[t]={n:0,ok:0};
    const rec=S.ans[qid];
    for(const k in rec){
      if(k[0]==="_")continue;
      const c=rec[k];byType[t].n++;tot++;if(c){byType[t].ok++;ok++;}
      const d=rec._date||today();if(!byDay[d])byDay[d]={n:0,ok:0};byDay[d].n++;if(c)byDay[d].ok++;
    }
  }
  let pending=0,totalWrong=0;
  for(const qid in S.wrong)for(const i in S.wrong[qid]){totalWrong++;if(S.wrong[qid][i].next<=today())pending++}
  return{tot,ok,byType,byDay,pending,totalWrong};
}
function updateStat(){
  const a=analyze();const p=a.tot?Math.round(a.ok/a.tot*100):0;
  const wc=Object.keys(S.wordbook).length;
  $("#st").textContent="已做 "+a.tot+" 题 · 正确率 "+p+"% · 单词本 "+wc+" 词";
}

  ["today","prac","wrong","wordbook","stat"].forEach(x=>$("#v-"+x).classList.toggle("hide",x!==t));

    else if(t==="prac")rPrac();
    else if(t==="wrong")rWrong();
    else if(t==="wordbook")rWordbook();
    else rStat();
  }catch(e){console.error(e);toast("渲染出错："+e.message)}
}

function rToday(){
  const box=$("#todayBox"),td=today();
  if(!S.plan[td]){S.plan[td]={items:nextBatch(),done:false};saveS()}
  const plan=S.plan[td];
  const dueMap={};
  for(const qid in S.wrong)for(const i in S.wrong[qid]){
    if(S.wrong[qid][i].next<=td){if(!dueMap[qid])dueMap[qid]=[];dueMap[qid].push(parseInt(i))}
  }
  const dueCount=Object.values(dueMap).reduce((s,a)=>s+a.length,0);

  let h='<h2 style="font-size:1rem;margin-bottom:12px;">📅 '+td+' 今日任务</h2>';
  if(dueCount){
    h+='<p style="font-size:.84rem;color:var(--mu);margin-bottom:8px;">🔁 遗忘曲线复习（'+dueCount+' 题到期）</p>';
    for(const qid in dueMap){
      const q=QS.find(x=>x.id===qid);if(!q)continue;
      h+='<div class="item" data-q="'+q.id+'" data-i="'+dueMap[qid][0]+'"><div><b>'+(q.title||q.id)+'</b><br><span style="color:var(--mu);font-size:.76rem;">'+q.year+" · "+q.source+" · "+dueMap[qid].length+' 个到期</span></div><span class="tag r">复习</span></div>';
    }
  } else h+='<p style="font-size:.84rem;color:var(--mu);margin-bottom:8px;">🔁 遗忘曲线复习（今日无到期）</p>';

  const nq=plan.items.map(id=>QS.find(q=>q.id===id)).filter(Boolean);
  if(nq.length){
    h+='<p style="font-size:.84rem;color:var(--mu);margin:14px 0 8px;">📖 今日新题（'+nq.length+' 道）</p>';
    nq.forEach(q=>{
      h+='<div class="item" data-q="'+q.id+'"><div><b>'+(q.title||q.id)+'</b><br><span style="color:var(--mu);font-size:.76rem;">'+q.year+" · "+q.source+" · "+q.questions.length+' 空</span></div><span class="tag n">新题</span></div>';
    });
  } else h+='<div class="empty">题库中已没有更多新题。</div>';

  box.innerHTML=h;
  box.querySelectorAll(".item").forEach(el=>{
    el.onclick=()=>{
      const q=QS.find(x=>x.id===el.dataset.q);if(!q)return;
      if(el.dataset.i!==undefined&&el.dataset.i!=="")openAt(q,+el.dataset.i);else open(q);
    };
  });
  if(dueCount+nq.length>0){
    const b=document.createElement("button");
    b.className="btn";b.style.marginTop="14px";b.textContent="▶ 开始今日练习";
    b.onclick=()=>{
      const dq=Object.keys(dueMap)[0];
      if(dq){const q=QS.find(x=>x.id===dq);if(q){openAt(q,dueMap[dq][0]);return}}
      if(nq[0])open(nq[0]);
    };
    box.appendChild(b);
  }
}
function nextBatch(){
  const done=new Set(Object.keys(S.ans));
  return QS.filter(q=>!done.has(q.id)).slice(0,3).map(q=>q.id);
}

// ============================================================
// 打开题组
// ============================================================
function open(q){
  cur=q;groupCompleted=false;
  let start=0;
  for(let i=0;i<q.questions.length;i++){
    const rec=S.ans[q.id];
    if(!rec||rec[i]===undefined){start=i;break}
  }
  curIdx=start;picked=null;shown=false;
  tab("prac");
}
function openAt(q,i){cur=q;curIdx=i;picked=null;shown=false;groupCompleted=false;tab("prac")}

// ============================================================
// 自由练习 —— 一题一题
// ============================================================
function rPrac(){
  const box=$("#pracBox");
  if(!cur){box.innerHTML='<div class="empty">题库为空</div>';return}
  const q=cur;
  if(!q){box.innerHTML='<div class="empty">题库为空</div>';return}
  const total=q.questions.length;

  // ★ 完成检查提前
  if(curIdx>=total||groupCompleted){
    renderReviewMode(q,box,total);
    return;
  }

  const it=q.questions[curIdx];
  if(!it){box.innerHTML='<div class="empty">题目数据缺失</div>';return}

  let h='<div class="meta">'
    +'<span class="bdg t">'+(q.type==="cloze"?"完形填空":q.type==="grammar"?"语法填空":"七选五")+'</span>'
    +'<span class="bdg">'+q.year+" · "+q.source+'</span>'
    +(q.title?'<span class="bdg">'+q.title+'</span>':"")
    +'<span class="bdg" style="margin-left:auto;">第 '+(curIdx+1)+' / '+total+' 题</span>'
    +'</div>';
  h+='<div class="prog-line"><div style="width:'+((curIdx)/total*100)+'%"></div></div>';

  let pass=String(q.passage||"").replace(/__(\d+)__/g,(m,n)=>{
    const hi=(n===it.stem)?' hl':'';
    return '<span class="blank'+hi+'">'+n+'</span>';
  });
  pass=pass.split("\n").map(x=>"<p>"+x+"</p>").join("");
  h+='<div class="pass">'+pass+'</div>';

  if(q.sharedOptions){
    h+='<div style="margin-bottom:14px;font-size:.85rem;background:#f8fafc;padding:11px;border-radius:9px;"><b>选项池：</b><br>';
    q.sharedOptions.forEach((o,j)=>{
      const rec=S.ans[q.id]||{};let used=false;
      for(let k=0;k<total;k++){
        if(k===curIdx)continue;
        const ki=String(k);
        if(rec[ki]!==undefined&&q.questions[k]&&q.questions[k].answer===j)used=true;
      }
      h+='<div style="margin-top:5px;'+(used?"opacity:.45;":"")+'"><b>'+"ABCDEFG"[j]+".</b> "+o+(used?" ✓":"")+"</div>";
    });
    h+="</div>";
  }

  h+='<div class="qcard">';
  h+='<div class="stem">第 '+it.stem+' 空</div>';
  const opts=it.options||q.sharedOptions||[];
  if(it.input){
    const v=picked||"";let c="";
    if(shown)c=eq(picked,it.answer)?"ok":"bad";
    h+='<input class="inp '+c+'" id="gi" value="'+String(v).replace(/"/g,"&quot;")+'" '+(shown?"disabled":"")+' placeholder="填入答案" autocomplete="off">';
  }else{
    h+='<div class="opts">';
    opts.forEach((o,j)=>{
      let c="opt";
      if(shown){if(j===it.answer)c+=" ok";else if(j===picked)c+=" bad";c+=" dis"}
      else if(j===picked)c+=" sel";
      h+='<div class="'+c+'" data-j="'+j+'"><span class="l">'+"ABCDEFG"[j]+'</span><span>'+String(o).replace(/^[A-G]\.\s*/,"")+'</span></div>';
    });
    h+="</div>";
  }
  h+="</div>";

  if(shown){
    const correct=(it.input)?eq(picked,it.answer):(picked===it.answer);
    const ansTxt=it.input?it.answer:"ABCDEFG"[it.answer];
    h+='<div class="exp'+(correct?"":" wrong")+'">';
    h+='<div class="row">'+(correct?'<span style="color:var(--ok);">✅ 回答正确</span>':'<span style="color:var(--er);">❌ 回答错误</span>')+'<span class="ans">正确答案：'+ansTxt+'</span></div>';
    h+='<div><span class="lbl">详解：</span>'+(it.explanation||"暂无解析")+'</div>';
    h+="</div>";
  }

  h+='<div class="btnrow">';
  if(!shown){
    const canSubmit=it.input?(picked!==null&&picked!==""):(picked!==null);
    h+='<button class="btn" id="sb" '+(canSubmit?"":"disabled")+'>提交并查看详解</button>';
    h+='<span style="font-size:.78rem;color:var(--mu);">选好后点击提交</span>';
  }else{
    const last=(curIdx>=total-1);
    h+='<button class="btn ok" id="nx">'+(last?"✅ 完成本组":"下一题 →")+'</button>';
    h+='<button class="btn o" id="pr">上一题</button>';
  }
  h+="</div>";

  box.innerHTML=h;

  box.querySelectorAll(".opt[data-j]").forEach(el=>{
    el.onclick=()=>{if(shown)return;picked=+el.dataset.j;submit(q,curIdx,it)};
  });
  const gi=box.querySelector("#gi");
  if(gi){
    gi.oninput=()=>{picked=gi.value;const b=box.querySelector("#sb");if(b)b.disabled=(picked==="")};
    gi.onkeydown=(e)=>{if(e.key==="Enter"&&picked)submit(q,curIdx,it)};
    setTimeout(()=>gi.focus(),50);
  }
  const sb=box.querySelector("#sb");if(sb)sb.onclick=()=>submit(q,curIdx,it);
  const nx=box.querySelector("#nx");
  if(nx)nx.onclick=()=>{
    if(curIdx>=total-1){groupCompleted=true;rPrac()}
    else{curIdx++;picked=null;shown=false;rPrac()}
  };
  const pr=box.querySelector("#pr");
  if(pr)pr.onclick=()=>{if(curIdx>0){curIdx--;picked=null;shown=false;rPrac()}};
}

// ============================================================
// 提交单题
// ============================================================
function submit(q,i,it){
  if(shown)return;
  const td=today();
  if(!S.ans[q.id])S.ans[q.id]={_date:td};
  let correct;
  if(it.input)correct=eq(picked,it.answer);
  else correct=(picked===it.answer);
  S.ans[q.id][i]=correct;
  if(correct){
    const w=S.wrong[q.id]&&S.wrong[q.id][i];
    if(w){
      const ns=w.stage+1;
      if(ns>=GAPS.length){
        delete S.wrong[q.id][i];
        if(Object.keys(S.wrong[q.id]).length===0)delete S.wrong[q.id];
      }else{w.stage=ns;w.next=addDays(td,GAPS[ns]);w.last=td}
    }
  }else{
    if(!S.wrong[q.id])S.wrong[q.id]={};
    const old=S.wrong[q.id][i];
    S.wrong[q.id][i]={stage:0,next:addDays(td,GAPS[0]),count:((old&&old.count)||0)+1,last:td,first:(old&&old.first)||td};
  }
  saveS();updateStat();shown=true;rPrac();
}

// ============================================================
// 复盘模式 —— 整组完成后
// ============================================================
function renderReviewMode(q,box,total){
  const rec=S.ans[q.id]||{};
  let correctCount=0,wrongCount=0;
  const wrongItems=[];
  q.questions.forEach((it,i)=>{
    const c=rec[i];
    if(c===true)correctCount++;
    else if(c===false){wrongCount++;wrongItems.push({i,it})}
  });

  let h='<div class="meta"><span class="bdg ok">🎉 本组完成</span><span class="bdg">'+(q.title||q.id)+'</span><span class="bdg t">'+correctCount+'/'+total+' 正确</span></div>';
  h+='<div class="review-bar"><b>💡 复盘模式</b>：选中文章或选项中的任意单词/词组，即可查看翻译。如果是高考3500词，可选择加入单词本。</div>';

  // 文章复盘（可选中）
  let pass=String(q.passage||"").replace(/__(\d+)__/g,(m,n)=>'<span class="blank">'+n+'</span>');
  pass=pass.split("\n").map(x=>"<p>"+x+"</p>").join("");
  h+='<div class="pass" id="reviewPass" style="max-height:40vh;cursor:text;">'+pass+'</div>';

  // 七选五选项池复盘
  if(q.sharedOptions){
    h+='<div style="margin-bottom:14px;font-size:.85rem;background:#f8fafc;padding:11px;border-radius:9px;"><b>选项池：</b><br>';
    q.sharedOptions.forEach((o,j)=>{h+='<div style="margin-top:5px;"><b>'+"ABCDEFG"[j]+".</b> "+o+"</div>"});
    h+="</div>";
  }

  // 错题详解
  if(wrongItems.length){
    h+='<h3 style="font-size:.9rem;margin:16px 0 10px;color:var(--er);">❌ 需要巩固的题目（'+wrongCount+' 题）</h3>';
    wrongItems.forEach(({i,it})=>{
      const ansTxt=it.input?it.answer:"ABCDEFG"[it.answer];
      h+='<div class="exp wrong" style="margin-bottom:10px;">';
      h+='<div class="row"><span class="ans">第 '+it.stem+' 空 正确答案：'+ansTxt+'</span></div>';
      h+='<div><span class="lbl">详解：</span>'+(it.explanation||"暂无解析")+'</div>';
      h+="</div>";
    });
  } else {
    h+='<div class="empty" style="color:var(--ok);">🎉 全部答对，太棒了！</div>';
  }

  h+='<div class="btnrow" style="justify-content:center;margin-top:18px;">'
    +'<button class="btn o" id="rvAgain">重做本组</button>'
    +'<button class="btn" id="rvNext">下一组 →</button>'
    +'</div>';

  box.innerHTML=h;

  // 绑定按钮
  const ag=box.querySelector("#rvAgain");
  if(ag)ag.onclick=()=>{curIdx=0;picked=null;shown=false;groupCompleted=false;delete S.ans[q.id];saveS();rPrac()};
  const ng=box.querySelector("#rvNext");
  if(ng)ng.onclick=()=>{
    const done=new Set(Object.keys(S.ans));
    const nx=QS.find(x=>!done.has(x.id)&&x.id!==q.id);
    if(nx){cur=nx;curIdx=0;picked=null;shown=false;groupCompleted=false;rPrac()}
    else toast("没有更多题了");
  };
}

// ============================================================
// 错题本
// ============================================================
function rWrong(){
  const box=$("#wrongBox");
  const list=[];
  for(const qid in S.wrong){
    const q=QS.find(x=>x.id===qid);if(!q)continue;
    const idxs=Object.keys(S.wrong[qid]).map(Number).sort((a,b)=>a-b);
    if(idxs.length)list.push({q,idxs});
  }
  if(!list.length){box.innerHTML='<div class="empty">🎉 错题本是空的，继续保持！</div>';return}
  const td=today();
  let h='<h2 style="font-size:1rem;margin-bottom:14px;">🔁 错题本 · 遗忘曲线进度</h2>';
  list.forEach(({q,idxs})=>{
    h+='<div style="border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px;background:#fafafa;">';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;"><div><b>'+(q.title||q.id)+'</b><br><span style="color:var(--mu);font-size:.74rem;">'+q.year+" · "+q.source+" · "+idxs.length+' 个错题</span></div><button class="btn sm" data-go="'+q.id+'" data-i="'+idxs[0]+'">重做</button></div>';
    idxs.forEach(i=>{
      const w=S.wrong[q.id][i];
      const due=w.next<=td;
      h+='<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd);font-size:.8rem;">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;"><span>第 <b>'+q.questions[i].stem+'</b> 空 · 已错 '+w.count+' 次</span><span class="tag '+(due?"w":"m")+'">'+(due?"今日复习":"下次 "+w.next)+'</span></div>';
      h+='<div class="curve">';
      GAPS.forEach((g,gi)=>{let cls="pt";if(gi<w.stage)cls+=" d";else if(gi===w.stage)cls+=" c";h+='<div class="'+cls+'">'+g+'d</div>'});
      h+="</div></div>";
    });
    h+="</div>";
  });
  box.innerHTML=h;
  box.querySelectorAll("[data-go]").forEach(b=>{
    b.onclick=()=>{const q=QS.find(x=>x.id===b.dataset.go);if(q)openAt(q,+b.dataset.i)};
  });
}

// ============================================================
// 单词本
// ============================================================
function rWordbook(){
  const box=$("#wordbookBox");
  const words=Object.values(S.wordbook);
  if(!words.length){
    box.innerHTML='<div class="empty">📖 单词本还是空的。<br><br>做题时选中不认识的单词，如果它在高考3500词中，<br>就可以点「加入单词本」收录到这里。</div>';
    return;
  }
  let h='<h2 style="font-size:1rem;margin-bottom:6px;">📖 我的单词本</h2>';
  h+='<p style="font-size:.78rem;color:var(--mu);margin-bottom:14px;">共 '+words.length+' 个词 · 点单词可查看翻译</p>';
  words.sort((a,b)=>(b.added||"").localeCompare(a.added||""));
  words.forEach(w=>{
    h+='<div class="wordbook-item">';
    h+='<div style="flex:1;min-width:0;"><div class="wd">'+w.word+'</div><div class="tr">'+(w.trans||"")+'</div><div class="src">'+w.source+' · '+w.added+'</div></div>';
    h+='<button class="del" data-del="'+w.word.toLowerCase()+'">删除</button>';
    h+="</div>";
  });
  box.innerHTML=h;
  box.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick=()=>{
      delete S.wordbook[b.dataset.del];saveS();updateStat();rWordbook();toast("已删除");
    };
  });
}

// ============================================================
// 分析
// ============================================================
function rStat(){
  const box=$("#statBox");
  const a=analyze();
  const pct=a.tot?Math.round(a.ok/a.tot*100):0;
  let h='<h2 style="font-size:1rem;margin-bottom:14px;">📊 学习分析</h2>';
  h+='<div class="sg">'
    +'<div class="sb"><div class="n">'+a.tot+'</div><div class="l">总答题数</div></div>'
    +'<div class="sb"><div class="n" style="color:'+(pct>=80?"var(--ok)":pct>=60?"var(--pr)":"var(--er)")+'">'+pct+'%</div><div class="l">总正确率</div></div>'
    +'<div class="sb"><div class="n" style="color:var(--ok)">'+a.ok+'</div><div class="l">答对</div></div>'
    +'<div class="sb"><div class="n" style="color:var(--er)">'+(a.tot-a.ok)+'</div><div class="l">答错</div></div>'
    +'</div>';

  h+='<h3 style="font-size:.9rem;margin:18px 0 10px;">分题型正确率</h3>';
  const names={cloze:"完形填空",grammar:"语法填空",qixuanwu:"七选五"};
  for(const t in names){
    const d=a.byType[t]||{n:0,ok:0};const p=d.n?Math.round(d.ok/d.n*100):0;
    h+='<div style="margin-bottom:12px;"><div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:2px;"><span>'+names[t]+'</span><span style="color:var(--mu);">'+d.ok+"/"+d.n+' · '+p+'%</span></div><div class="prog '+(p>=80?"ok":p<60?"er":"")+'"><div style="width:'+p+'%"></div></div></div>';
  }

  const days=[];for(let i=6;i>=0;i--)days.push(addDays(today(),-i));
  const maxN=Math.max(1,...days.map(d=>(a.byDay[d]&&a.byDay[d].n)||0));
  h+='<h3 style="font-size:.9rem;margin:18px 0 10px;">近 7 天做题趋势</h3>';
  h+='<div class="week">';
  days.forEach(d=>{
    const dd=a.byDay[d]||{n:0,ok:0};const p=dd.n?Math.round(dd.ok/dd.n*100):0;
    const hgt=dd.n?Math.max(6,(dd.n/maxN)*70):2;
    h+='<div class="col '+(p>=80&&dd.n?"ok":"")+'"><div style="font-size:.6rem;color:var(--mu);">'+(dd.n?p+"%":"")+'</div><div class="bar" style="height:'+hgt+'px"></div><div class="lbl">'+d.slice(5)+'</div></div>';
  });
  h+="</div>";

  h+='<h3 style="font-size:.9rem;margin:18px 0 10px;">错题遗忘曲线进度</h3>';
  const sc={};GAPS.forEach((g,i)=>sc[i]=0);
  for(const qid in S.wrong)for(const i in S.wrong[qid]){const w=S.wrong[qid][i];sc[w.stage]=(sc[w.stage]||0)+1}
  h+='<div style="font-size:.82rem;margin-bottom:8px;"><b>待复习：</b>'+a.pending+' 题　<b>在曲线中：</b>'+a.totalWrong+' 题</div>';
  h+='<div class="curve">';
  GAPS.forEach((g,i)=>{h+='<div class="pt'+(sc[i]>0?" c":"")+'">'+g+'d<br><b>'+sc[i]+'</b></div>'});
  h+="</div>";

  const wc=Object.keys(S.wordbook).length;
  h+='<h3 style="font-size:.9rem;margin:18px 0 10px;">单词本</h3>';
  h+='<div style="font-size:.82rem;margin-bottom:8px;">已收录 <b>'+wc+'</b> 个词</div>';

  box.innerHTML=h;
}

// ============================================================
// 初始化
// ============================================================
$$(".tabs button").forEach(b=>{b.onclick=()=>tab(b.dataset.t)});
updateStat();
tab("today");
</script>
</body>
</html>
